name: Deploy PWA

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PWA files
        run: |
          node --check web/app.js
          node --check web/sw.js
          python -m json.tool web/manifest.webmanifest > /dev/null
          test -f web/index.html
          test -f web/styles.css
          test -f web/logo.svg

      - name: Prepare deployment
        env:
          WMA_BACKEND_URL: ${{ secrets.WMA_BACKEND_URL }}
        run: |
          rm -rf _site
          cp -R web _site
          printf '{"version":"%s"}\n' "$GITHUB_SHA" > _site/version.json
          printf 'window.WMA_BACKEND_URL = %s;\n' "$(printf '%s' "$WMA_BACKEND_URL" | python -c 'import json,sys; print(json.dumps(sys.stdin.read()))')" > _site/runtime-config.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload PWA
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
